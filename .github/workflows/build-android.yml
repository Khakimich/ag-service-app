# AG_ANDROID1: сборка APK (для сайта) и AAB (для RuStore) с подписью релизным ключом.
# Запуск вручную: Actions → Build Android → Run workflow.
# Секреты (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_B64   — файл ключа .jks одной строкой base64
#   ANDROID_KEY_ALIAS      — alias ключа
#   ANDROID_KEY_PASSWORD   — пароль ключа
#   ANDROID_STORE_PASSWORD — пароль хранилища
#   SSH_HOST / SSH_USER / SSH_KEY — те же, что для веб-выкладки (APK кладётся на сайт)
name: Build Android

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ключ подписи
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SPASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$KS" || { echo "Нет секрета ANDROID_KEYSTORE_B64"; exit 1; }
          printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nkeyAlias=%s\nkeyPassword=%s\nstorePassword=%s\n' "$ALIAS" "$KPASS" "$SPASS" > android/key.properties

      - name: Шрифт Roboto
        run: |
          mkdir -p assets/fonts
          [ -s assets/fonts/Roboto.ttf ] || curl -fL -o assets/fonts/Roboto.ttf \
            "https://github.com/google/fonts/raw/main/ofl/roboto/Roboto%5Bwdth,wght%5D.ttf"

      - name: Сборка APK и AAB
        run: |
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/AG-Service-$V.apk"
          cp build/app/outputs/bundle/release/app-release.aab "out/AG-Service-$V.aab"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ag-service-android
          path: out/
          retention-days: 30

      - name: APK на сайт (app.autogrom.ru/download/AG-Service.apk)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          if printf '%s' "$SSH_KEY" | grep -q 'BEGIN'; then printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy; else printf '%s' "$SSH_KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/id_deploy; fi
          chmod 600 ~/.ssh/id_deploy
          SSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new"
          D=/home/khakimjon/web/app.autogrom.ru/public_html/download
          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p $D"
          A=$(ls out/*.apk)
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "$A" "$SSH_USER@$SSH_HOST:$D/AG-Service.apk"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "$A" "$SSH_USER@$SSH_HOST:$D/$(basename $A)"
          $SSH "$SSH_USER@$SSH_HOST" "chown -R khakimjon:khakimjon $D; ls -la $D"
