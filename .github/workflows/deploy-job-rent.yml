# AG_RENT1: выкладка «AG Гараж» в job.autogrom.ru (запуск вручную).
# Копирует новые файлы и добавляет пункт меню; перед изменением делает копии файлов.
name: Deploy job — AG Garage

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: SSH-ключ
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          if printf '%s' "$SSH_KEY" | grep -q 'BEGIN'; then printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy; else printf '%s' "$SSH_KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/id_deploy; fi
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Выкладка
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p $SSH_PORT $SSH_USER@$SSH_HOST"
          # папка job на сервере
          J=$($SSH 'for d in /home/khakimjon/web/job.autogrom.ru/public_html /var/www/job.autogrom.ru; do [ -f "$d/ag_service/_layout.php" ] && echo "$d" && exit 0; done; dirname "$(dirname "$(find /home /var/www -maxdepth 6 -path "*job.autogrom.ru*/ag_service/_layout.php" 2>/dev/null | head -1)")"')
          echo "job: $J"
          [ -n "$J" ] && $SSH "test -f '$J/ag_service/_layout.php'" || { echo "Папка job не найдена"; exit 1; }
          B="/root/ag_backups/job_rent_$(date +%Y%m%d_%H%M%S)"
          $SSH "mkdir -p '$B' && cp -a '$J/ag_service/_layout.php' '$B/' && for f in ag_rent_feed.php includes/ag_rent_lib.php ag_service/rent.php; do [ -f '$J/'\$f ] && cp -a '$J/'\$f '$B/' || true; done; echo backup: $B"
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" deploy/job_rent/ag_rent_feed.php "$SSH_USER@$SSH_HOST:$J/ag_rent_feed.php"
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" deploy/job_rent/includes/ag_rent_lib.php "$SSH_USER@$SSH_HOST:$J/includes/ag_rent_lib.php"
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" deploy/job_rent/ag_service/rent.php "$SSH_USER@$SSH_HOST:$J/ag_service/rent.php"
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" deploy/job_rent/patch_layout.py "$SSH_USER@$SSH_HOST:/tmp/ag_rent_patch_layout.py"
          $SSH "python3 /tmp/ag_rent_patch_layout.py '$J/ag_service/_layout.php' && rm -f /tmp/ag_rent_patch_layout.py"
          O=$($SSH "stat -c %U:%G '$J/ag_service/_layout.php'")
          $SSH "chown $O '$J/ag_rent_feed.php' '$J/includes/ag_rent_lib.php' '$J/ag_service/rent.php' && mkdir -p '$J/uploads/ag_rent' && chown $O '$J/uploads/ag_rent' && chmod 775 '$J/uploads/ag_rent'"
          $SSH "for f in ag_rent_feed.php includes/ag_rent_lib.php ag_service/rent.php ag_service/_layout.php; do php -l '$J/'\$f; done"
          echo "--- feed:"; curl -s https://job.autogrom.ru/ag_rent_feed.php | head -c 300; echo
