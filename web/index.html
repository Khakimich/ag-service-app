<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Автогром Сервис: запись, статус ремонта, бонусы">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AG Service">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AG Service</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111113">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <!-- AG_WEBFAST1: экран загрузки, пока скачивается приложение (на iPhone первый запуск — несколько секунд) -->
  <style>
    /* AG_SPLASH2: мягкий экран загрузки — тёплое свечение, «дышащий» логотип, кольца, полоса загрузки, сменяющиеся подсказки */
    html,body{margin:0;height:100%;background:#121214;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
    #ag-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
      background:radial-gradient(60vmax 60vmax at 50% 42%,rgba(255,122,26,.20),transparent 60%),radial-gradient(50vmax 40vmax at 85% 110%,rgba(255,170,90,.10),transparent 60%),#121214;
      font-family:-apple-system,"Segoe UI",Roboto,sans-serif;transition:opacity .5s ease,transform .5s ease}
    #ag-splash.out{opacity:0;transform:scale(1.04)}
    .ags-blob{position:absolute;width:42vmax;height:42vmax;border-radius:50%;filter:blur(60px);opacity:.35;background:#FF7A1A;animation:agsFloat 9s ease-in-out infinite}
    .ags-blob.b2{width:30vmax;height:30vmax;background:#FFB46B;opacity:.18;animation-duration:12s;animation-direction:reverse}
    @keyframes agsFloat{0%,100%{transform:translate(-18vmax,-10vmax)}50%{transform:translate(16vmax,8vmax)}}
    .ags-logo{position:relative;width:108px;height:108px;display:grid;place-items:center;animation:agsIn .8s cubic-bezier(.2,.9,.3,1.2) both}
    .ags-logo img{width:96px;height:96px;border-radius:28px;box-shadow:0 22px 48px -14px rgba(242,98,0,.7);animation:agsBreath 2.4s ease-in-out infinite;position:relative;z-index:2}
    .ags-ring{position:absolute;inset:0;border-radius:34px;border:2px solid rgba(255,138,61,.55);animation:agsRing 2.4s ease-out infinite}
    .ags-ring.r2{animation-delay:1.2s}
    @keyframes agsIn{from{opacity:0;transform:translateY(14px) scale(.85)}to{opacity:1;transform:none}}
    @keyframes agsBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @keyframes agsRing{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.7);opacity:0}}
    .ags-title{margin-top:30px;color:#fff;font-weight:800;font-size:22px;letter-spacing:-.3px;animation:agsIn .8s .15s both}
    .ags-bar{margin-top:18px;width:170px;height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;animation:agsIn .8s .25s both}
    .ags-bar i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#FF8A3D,#F26200);animation:agsBar 1.4s ease-in-out infinite}
    @keyframes agsBar{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
    .ags-hint{margin-top:14px;height:20px;color:#9CA3AF;font-size:13.5px;font-weight:600;transition:opacity .4s}
    @media (prefers-reduced-motion:reduce){.ags-blob,.ags-logo img,.ags-ring,.ags-bar i{animation:none}}
  </style>
</head>
<body>
  <div id="ag-splash">
    <div class="ags-blob"></div><div class="ags-blob b2"></div>
    <div class="ags-logo"><span class="ags-ring"></span><span class="ags-ring r2"></span><img src="icons/Icon-192.png" alt="AG Service" onerror="this.style.display='none'"></div>
    <div class="ags-title">AG Service</div>
    <div class="ags-bar"><i></i></div>
    <div class="ags-hint" id="ags-hint">Загружаем приложение…</div>
  </div>
  <script>
    (function () {
      var hints = ["Загружаем приложение…", "Готовим ваш гараж…", "Проверяем записи…", "Почти готово…"], i = 0;
      var el = document.getElementById("ags-hint");
      var t = setInterval(function () {
        if (!el || !document.getElementById("ag-splash")) return clearInterval(t);
        el.style.opacity = 0;
        setTimeout(function () { i = (i + 1) % hints.length; el.textContent = hints[i]; el.style.opacity = 1; }, 400);
      }, 1800);
      // убрать экран загрузки, когда Flutter нарисовал первый кадр
      window.addEventListener("flutter-first-frame", function () {
        var s = document.getElementById("ag-splash"); if (!s) return;
        clearInterval(t); s.classList.add("out"); setTimeout(function () { s.remove(); }, 520);
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- AG_IOS_INSTALL: подсказка "Установить на iPhone" (добавить на экран Домой) -->
  <script>
  (function () {
    try {
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
      if (!isIOS || standalone) return;
      var KEY = 'ag_ios_install_hidden_until';
      try { if (Date.now() < +(localStorage.getItem(KEY) || 0)) return; } catch (e) {}
      var inApp = /Instagram|FBAN|FBAV|Telegram|VKClient|WhatsApp|YaBrowser\/.*Mobile.*WebView/.test(ua);
      var html =
        '<div style="font-weight:700;font-size:17px;margin-bottom:8px">Установите AG Service на iPhone</div>' +
        (inApp
          ? '<div>Откройте эту страницу в <b>Safari</b>: нажмите «⋯» → «Открыть в Safari», затем следуйте подсказке.</div>'
          : '<div style="line-height:1.6">1. Нажмите <b>«Поделиться»</b> ' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0A84FF" stroke-width="2" style="vertical-align:-3px"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v8h14v-8"/></svg>' +
            ' внизу экрана<br>2. Выберите <b>«На экран „Домой“»</b><br>3. Нажмите <b>«Добавить»</b></div>' +
            '<div style="margin-top:6px;color:#9CA3AF;font-size:13px">Приложение появится на экране как обычное, с уведомлениями и входом.</div>') +
        '<button id="ag-ios-close" style="margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px;background:#2A2A2E;color:#fff;font:600 15px -apple-system,sans-serif">Понятно</button>';
      function show() {
        var d = document.createElement('div');
        d.id = 'ag-ios-install';
        d.setAttribute('style', 'position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:99999;' +
          'background:#1C1C1F;color:#fff;border-radius:18px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.5);' +
          'font:15px -apple-system,Segoe UI,Roboto,sans-serif');
        d.innerHTML = html;
        document.body.appendChild(d);
        document.getElementById('ag-ios-close').onclick = function () {
          try { localStorage.setItem(KEY, String(Date.now() + 3 * 24 * 3600 * 1000)); } catch (e) {}
          d.remove();
        };
      }
      setTimeout(show, 2500);
    } catch (e) {}
  })();
  </script>
</body>
</html>
