<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Автогром Сервис: запись, статус ремонта, бонусы">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AG Service">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AG Service</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111113">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <!-- AG_WEBFAST1: экран загрузки, пока скачивается приложение (на iPhone первый запуск — несколько секунд) -->
  <style>
    html,body{margin:0;height:100%;background:#111113;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
    #ag-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#111113;z-index:9999;transition:opacity .35s}
    #ag-splash img{width:92px;height:92px;border-radius:26px;box-shadow:0 18px 40px -12px rgba(242,98,0,.55)}
    #ag-splash i{width:34px;height:34px;border-radius:50%;border:3px solid rgba(242,98,0,.25);border-top-color:#F26200;animation:ags .8s linear infinite}
    #ag-splash b{color:#9CA3AF;font:600 14px -apple-system,Segoe UI,Roboto,sans-serif}
    @keyframes ags{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="ag-splash"><img src="icons/Icon-192.png" alt="AG Service" onerror="this.style.display='none'"><i></i><b>AG Service загружается…</b></div>
  <script>
    // убрать экран загрузки, когда Flutter нарисовал первый кадр
    window.addEventListener("flutter-first-frame", function () {
      var s = document.getElementById("ag-splash"); if (!s) return;
      s.style.opacity = "0"; setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
